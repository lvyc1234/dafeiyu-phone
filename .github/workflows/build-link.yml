name: build-dafeiyu

on:
  workflow_dispatch:
  push:
    paths:
      - 'link/**'
      - 'serverapp/**'
      - '.github/workflows/build-link.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build client APK
        working-directory: link
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build server APK
        working-directory: serverapp
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APKs with flat names
        run: |
          mkdir -p out
          cp link/app/build/outputs/apk/debug/app-debug.apk out/DafeiyuLink-debug.apk
          cp serverapp/app/build/outputs/apk/debug/app-debug.apk out/DafeiyuServer-debug.apk
          ls -lh out
          sha256sum out/*.apk

      - name: Publish APKs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "最新构建" --notes "自动构建产物，每次 push 覆盖同名文件"
          gh release upload latest out/DafeiyuLink-debug.apk --clobber
          gh release upload latest out/DafeiyuServer-debug.apk --clobber

      - name: Backup as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-apks
          path: out/*.apk
          if-no-files-found: error
