name: build-dafeiyu-link

on:
  workflow_dispatch:
  push:
    paths:
      - 'link/**'
      - '.github/workflows/build-link.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: link
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK with flat name
        run: |
          mkdir -p out
          cp link/app/build/outputs/apk/debug/app-debug.apk out/DafeiyuLink-debug.apk
          ls -lh out
          sha256sum out/DafeiyuLink-debug.apk

      # 直接把 apk 挂到 release，点链接就是 apk，不是 zip
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "最新构建" --notes "自动构建产物，每次 push 覆盖同名文件"

          # 把 APK 做成固定文件名，下载链接永远不变
          gh release upload latest out/DafeiyuLink-debug.apk --clobber

      - name: Backup as artifact (zip, 仅留档)
        uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-link-apk
          path: out/DafeiyuLink-debug.apk
          if-no-files-found: error
