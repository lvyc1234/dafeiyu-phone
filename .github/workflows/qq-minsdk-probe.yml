name: qq-minsdk-probe

# 临时探测：确认哪些 QQ 安卓版本仍然支持 Android 4.4（minSdkVersion 19）
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe sources
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"
          probe() {
            echo "################ $1"
            code=$(curl -sL --max-time 90 -A "$UA" -o /tmp/p.out -w '%{http_code}' "$1" || true)
            echo "http=$code bytes=$(wc -c < /tmp/p.out 2>/dev/null || echo 0)"
            head -c 200 /tmp/p.out; echo
          }
          probe "https://ws75.aptoide.com/api/7/listAppVersions/package_name=com.tencent.mobileqq/limit=20"
          probe "https://ws57.aptoide.com/api/7/app/get/package_name=com.tencent.mobileqq"
          probe "https://qq.cn.uptodown.com/android/versions"
          probe "https://www.apkmirror.com/apk/tencent-mobile-holdings-inc/qq/"
          probe "https://apkcombo.com/qq/com.tencent.mobileqq/old-versions/"

      - name: uptodown versions detail
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"
          curl -sL --max-time 120 -A "$UA" "https://qq.cn.uptodown.com/android/versions" -o /tmp/ut.html || true
          echo "bytes: $(wc -c < /tmp/ut.html)"
          grep -aoE '[0-9]+\.[0-9]+\.[0-9]+|Android [0-9]+\.[0-9]+' /tmp/ut.html | sort -u | head -40 || true
          grep -aoE '.{80}(Android 4|Android 5).{100}' /tmp/ut.html | head -10 || true

      - name: aptoide json
        continue-on-error: true
        run: |
          for host in ws75 ws2 ws57 ws90; do
            echo "######## $host"
            curl -s --max-time 60 -A "Mozilla/5.0" "https://${host}.aptoide.com/api/7/listAppVersions/package_name=com.tencent.mobileqq/limit=30" -o /tmp/a.json || true
            echo "bytes: $(wc -c < /tmp/a.json 2>/dev/null || echo 0)"
            head -c 400 /tmp/a.json; echo
          done
