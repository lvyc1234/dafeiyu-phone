name: qq-minsdk-probe

# 临时探测：确认哪些 QQ 安卓版本仍然支持 Android 4.4（minSdkVersion 19）
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: apkmirror index
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"
          curl -sL --max-time 120 -A "$UA" "https://www.apkmirror.com/apk/tencent-mobile-holdings-inc/qq/" -o /tmp/idx.html || true
          echo "idx bytes: $(wc -c < /tmp/idx.html)"
          grep -oE 'href="/apk/tencent-mobile-holdings-inc/qq/[^"#?]+"' /tmp/idx.html | sed 's/href="//;s/"$//' | sort -u | head -40 > /tmp/slugs.txt || true
          cat /tmp/slugs.txt

      - name: apkmirror version pages
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"
          n=0
          while read -r slug; do
            [ -z "$slug" ] && continue
            n=$((n+1)); [ "$n" -gt 14 ] && break
            echo "################ $slug"
            curl -sL --max-time 90 -A "$UA" "https://www.apkmirror.com${slug}" -o /tmp/v.html || true
            echo "bytes: $(wc -c < /tmp/v.html)"
            grep -aoE '.{60}(Requires Android|and up|Android [0-9]\.[0-9]).{80}' /tmp/v.html | head -4 || true
            grep -aoE 'version-name[^<]{0,80}|Android [0-9]+\.[0-9]+' /tmp/v.html | sort -u | head -6 || true
          done < /tmp/slugs.txt

      - name: apkcombo fallback
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"
          curl -sL --max-time 120 -A "$UA" "https://apkcombo.com/qq/com.tencent.mobileqq/old-versions/" -o /tmp/c.html || true
          echo "combo bytes: $(wc -c < /tmp/c.html)"
          grep -aoE 'Android [0-9]+\.[0-9]+|8\.[0-9]+\.[0-9]+' /tmp/c.html | sort | uniq -c | sort -rn | head -20 || true
