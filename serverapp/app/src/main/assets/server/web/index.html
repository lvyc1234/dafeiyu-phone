<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>大肥鱼 Link</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font: 16px/1.45 -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  background: #EDEDED; color: #111; display: flex; justify-content: center;
  overscroll-behavior: none;
}
#app {
  position: relative; display: flex; flex-direction: column;
  width: 100%; max-width: 760px; height: 100vh; height: 100dvh;
  background: #EDEDED; overflow: hidden;
}
@media (min-width: 768px) {
  #app { border-left: 1px solid #D6D6D6; border-right: 1px solid #D6D6D6; }
}

/* ---------- 顶栏 ---------- */
#top {
  flex: 0 0 auto; height: 52px; display: flex; align-items: center; gap: 10px;
  padding: 0 12px; background: #EDEDED; border-bottom: 1px solid #D6D6D6; z-index: 3;
}
#title { font-size: 17px; font-weight: 600; flex: 1 1 auto; letter-spacing: .5px; }
#stat { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #6A6A6A; }
#dot { width: 8px; height: 8px; border-radius: 50%; background: #B9B9B9; flex: 0 0 auto; }
#dot.on { background: #20B24B; }
#dot.wait { background: #F0A020; }
#dot.off { background: #E04B4B; }
#clear {
  font: inherit; font-size: 13px; color: #3A6EA5; background: none; border: 0;
  padding: 7px 8px; margin: -7px -8px -7px 0; cursor: pointer;
}

/* ---------- 消息区 ---------- */
#main { position: relative; flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
#msgs {
  flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 12px 12px 4px;
  -webkit-overflow-scrolling: touch;
}
.row { display: flex; flex-direction: column; margin: 0 0 13px; animation: in .12s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.row.me { align-items: flex-end; }
.row.you { align-items: flex-start; }
.bubble {
  max-width: 76%; padding: 8px 11px; border-radius: 8px; background: #FFFFFF;
  font-size: 15px; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  box-shadow: 0 1px 1px rgba(0, 0, 0, .04);
}
.row.me .bubble { background: #95EC69; }
.bubble.big {
  background: transparent !important; box-shadow: none; padding: 2px 4px;
  font-size: 34px; line-height: 1.15;
}
.meta { display: flex; align-items: center; gap: 4px; margin-top: 3px; font-size: 11px; color: #9A9A9A; }
.st { color: #9A9A9A; }
.st.bad { color: #E04B4B; font-weight: 700; }
.system {
  margin: 4px 0 12px; text-align: center; font-size: 12px; color: #9A9A9A;
  padding: 0 12px; line-height: 1.6;
}
.system.bad { color: #C64A4A; }
  .ava {
    width: 34px; height: 34px; border-radius: 50%;
    object-fit: cover; flex: 0 0 34px; margin-right: 6px;
    align-self: flex-start; background: #D6ECFF;
  }
  .row { display: flex; align-items: flex-end; }
  .row.me { flex-direction: row-reverse; }
  .row.me .ava { display: none; }
  .typing .bubble { color: #888; font-style: italic; }

  .bubble.img { padding: 3px; background: #fff; }
  .bubble.img img { display: block; max-width: 62vw; max-height: 40vh; border-radius: 10px; cursor: zoom-in; }
  #imgBtn { font-size: 17px; }

#empty {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  pointer-events: none; padding: 0 24px;
}
#empty p { margin: 0; font-size: 13px; color: #9A9A9A; text-align: center; max-width: 78%; line-height: 1.7; }

/* ---------- 表情面板 ---------- */
#emojiPanel {
  flex: 0 0 auto; display: none; height: auto; max-height: 46vh; overflow-y: auto;
  background: #F7F7F7; border-top: 1px solid #E2E2E2; padding: 6px;
  grid-template-columns: repeat(8, 1fr); gap: 2px;
}
#emojiPanel.open { display: grid; }
.emo {
  height: 36px; display: flex; align-items: center; justify-content: center;
  font-size: 23px; line-height: 1; background: none; border: 0; border-radius: 6px;
  padding: 0; cursor: pointer;
}
.emo:active { background: #E4E4E4; }

/* ---------- 输入区 ---------- */
#bar {
  flex: 0 0 auto; display: flex; align-items: flex-end; gap: 8px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
  background: #F7F7F7; border-top: 1px solid #DADADA;
}
#emojiBtn {
  flex: 0 0 auto; font-size: 22px; line-height: 1; padding: 6px 4px;
  background: none; border: 0; cursor: pointer; color: #555;
}
#ta {
  flex: 1 1 auto; min-height: 38px; max-height: 110px; resize: none;
  border: 1px solid #DCDCDC; border-radius: 6px; background: #FFF; color: #111;
  padding: 8px 10px; font: inherit; font-size: 15px; line-height: 1.4; outline: none;
  overflow-y: auto;
}
#ta:focus { border-color: #B9D8C4; }
#send {
  flex: 0 0 auto; border: 0; border-radius: 6px; background: #07C160; color: #FFF;
  font: inherit; font-size: 16px; line-height: 1; padding: 10px 13px; cursor: pointer;
}
#send:active { background: #06A852; }

/* ---------- 令牌输入 ---------- */
#gate {
  position: absolute; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center;
  background: rgba(237, 237, 237, .97); padding: 24px;
}
#gate.hide { display: none; }
.card {
  width: 100%; max-width: 330px; background: #FFF; border-radius: 12px; padding: 20px 18px 18px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, .13); text-align: center;
}
.card h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
.card p { margin: 0 0 14px; font-size: 12px; color: #8A8A8A; line-height: 1.6; min-height: 18px; }
#tok {
  width: 100%; padding: 10px; border: 1px solid #DCDCDC; border-radius: 8px;
  font: inherit; font-size: 13px; text-align: center; outline: none; color: #111; background: #FAFAFA;
}
#tok:focus { border-color: #B9D8C4; background: #FFF; }
#go {
  width: 100%; margin-top: 12px; padding: 11px; border: 0; border-radius: 8px;
  background: #07C160; color: #FFF; font: inherit; font-size: 15px; cursor: pointer;
}
#go:active { background: #06A852; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="title">大肥鱼</div>
    <div id="stat"><span id="dot" class="off"></span><span id="statText">已断开</span></div>
    <button id="clear" type="button">清屏</button>
  </div>

  <div id="main">
    <div id="msgs"></div>
    <div id="empty"><p>输入令牌连接，或让对方把带 ?t= 的链接发给你</p></div>
  </div>

  <div id="emojiPanel"></div>

  <div id="bar">
    <button id="emojiBtn" type="button" title="表情">😀</button>
    <button id="imgBtn" type="button" title="图片">🖼</button>
    <textarea id="ta" rows="1" placeholder="说点什么…" autocomplete="off" autocapitalize="off"></textarea>
    <button id="send" type="button">➤</button>
  </div>

  <input id="fileInput" type="file" accept="image/*" style="display:none">

  <div id="gate">
    <div class="card">
      <h2>连接大肥鱼</h2>
      <p id="gateMsg">粘贴令牌（PSK 的 Base64，32 字节）</p>
      <input id="tok" type="text" placeholder="令牌" autocomplete="off" spellcheck="false" autocapitalize="off">
      <button id="go" type="button">连接</button>
    </div>
  </div>
</div>

    var type = b[3];
    var len = b[4] * 16777216 + b[5] * 65536 + b[6] * 256 + b[7];
    var counter = b[8] * 16777216 + b[9] * 65536 + b[10] * 256 + b[11];
    if (len < 0 || len > MAX_PLAIN) return;
    if (b.length !== HDR + len + TAGLEN) return;
    var plain = gcmOpen(key, nonce(DIR_IN, counter), b.subarray(0, HDR), b.subarray(HDR));
    if (plain === null) { authFail(); return; }
    onPlain(type, utf8Decode(plain));
  }

  function onPlain(type, text) {
    if (type === T_PING) {
      try { sendFrame(T_PONG, new Uint8Array(0)); } catch (e) {}
      return;
    }
    if (type === T_PONG) return;
    if (type === T_BYE) { if (ws) { try { ws.close(); } catch (e) {} } return; }
    if (type !== T_JSON || !text) return;
    var m;
    try { m = JSON.parse(text); } catch (e) { return; }
    if (!m || typeof m !== 'object') return;
    // 自己发的会被服务端广播回来，本地已经显示过，忽略
    if (m.from === 'web') return;
    if (m.t === 'text' || m.t === 'emoji') {
      var body = m.body == null ? '' : String(m.body);
      if (!body) return;
      // from=app/web 是主人自己发的（右侧），只有 bot 在左侧
      var side = (m.from === 'bot' || !m.from) ? 'you' : 'me';
      addBubble(side, body, m.ts, m.t);
    } else if (m.t === 'typing') {
      setTyping(!!m.on, m.text || '');
      return;
    } else if (m.t === 'image') {
      if (m.data) addImage('you', 'data:image/jpeg;base64,' + m.data, m.ts);
      else addSystem('🖼 ' + (m.name || '图片'), false);
    } else if (m.t === 'ping') {
      try { sendJSON({ t: 'pong' }); } catch (e) {}
    }
  }

  /* ================= 连接 / 握手 ================= */
  function wsLabel() {
    var h = location.host || 'localhost';
    if (h.indexOf(':') < 0) h += ':9528';
    return '连不上 ' + h + '/ws';
  }

  function startPing() {
    stopPing();
    pingTimer = setInterval(function () {
      try { sendFrame(T_PING, new Uint8Array(0)); } catch (e) {}
    }, PING_MS);
  }

  function stopPing() {
    if (pingTimer) { clearInterval(pingTimer); pingTimer = 0; }
  }

  function authFail() {
    if (authDead) return;
    authDead = true;
    key = null;
    ready = false;
    stopPing();
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = 0; }
    clearAll();
    addSystem('令牌不对，检查链接里的 t=', true, 'auth');
    setStat('off', '已断开');
    if (ws) { try { ws.close(); } catch (e) {} }
    ws = null;
    openGate('令牌不对，检查链接里的 t=');
  }

  function connect() {
    if (!psk || authDead) return;
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = 0; }
    if (ws) { try { ws.close(); } catch (e) {} ws = null; }
    key = null;
    ready = false;
    outCounter = 0;
    setStat('wait', '连接中');

    var sock;
    try {
      sock = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws');
    } catch (e) {
      setStat('off', '已断开');
      addSystem(wsLabel(), true, 'wsfail');
      retryTimer = setTimeout(connect, RETRY_MS);
      return;
    }
    sock.binaryType = 'arraybuffer';
    ws = sock;

    var saltC = randBytes(16);

    sock.onopen = function () {
      try { sock.send(saltC.buffer); } catch (e) {}
    };

    sock.onmessage = function (ev) {
      var data = ev.data;
      if (!(data instanceof ArrayBuffer)) return;
      if (!key) {
        if (data.byteLength !== 16) return;
        var saltS = new Uint8Array(data);
        var salt = new Uint8Array(32);
        salt.set(saltC, 0);
        salt.set(saltS, 16);
        key = hkdfSha256(psk, salt, utf8Encode(INFO), 32);
        ready = true;
        outCounter = 0;
        setStat('on', '在线');
        dropKeyed('wsfail');
        dropKeyed('auth');
        startPing();
        // 连上了就别再提示“输入令牌”
        if (emptyEl && msgsEl.childElementCount === 0) {
          emptyEl.querySelector('p').textContent = '连上了，说点什么吧';
        }
        return;
      }
      handleIncoming(data);
    };

    sock.onerror = function () {
      if (!ready) setStat('off', '已断开');
    };

    sock.onclose = function () {
      if (ws !== sock) return;
      var wasReady = ready;
      ready = false;
      key = null;
      ws = null;
      stopPing();
      markPendingFailed();
      setStat('off', '已断开');
      if (!wasReady) addSystem(wsLabel(), true, 'wsfail');
      if (!authDead) retryTimer = setTimeout(connect, RETRY_MS);
    };
  }

  function submitToken() {
    var raw = tokEl.value.trim();
    if (!raw) return;
    var bytes = parseToken(raw);
    if (!bytes) {
      gateMsgEl.textContent = '令牌格式不对，需要 32 字节的 Base64';
      return;
    }
    psk = bytes;
    authDead = false;
    stopPing();
    try {
      history.replaceState(null, '', location.pathname + '?t=' + encodeURIComponent(raw) + location.hash);
    } catch (e) {}
    closeGate();
    clearAll();
    connect();
  }

  /* ================= 令牌面板 ================= */
  function openGate(msg) {
    gateMsgEl.textContent = msg || '粘贴令牌（PSK 的 Base64，32 字节）';
    tokEl.value = '';
    gateEl.classList.remove('hide');
    setTimeout(function () { try { tokEl.focus(); } catch (e) {} }, 60);
  }

  function closeGate() { gateEl.classList.add('hide'); }

  /* ================= 发送动作 ================= */
  function pushPending(st) {
    st.textContent = '·';
    pendingEls.push(st);
  }

  function sendText() {
    if (!psk) { openGate(); return; }
    var text = taEl.value;
    if (!text || !text.trim()) return;
    text = text.replace(/\s+$/, '');
    taEl.value = '';
    autosize();
    var ts = Math.floor(Date.now() / 1000);
    var st = addBubble('me', text, ts);
    pushPending(st);
    setTyping(true, '正在输入…');
    try {
      sendJSON({ t: 'text', body: text, ts: ts });
      st.textContent = '';
      untrack(st);
    } catch (e) {
      st.textContent = '!';
      st.className = 'st bad';
      untrack(st);
    }
  }

  function sendEmoji(ch) {
    if (!psk) { openGate(); return; }
    var ts = Math.floor(Date.now() / 1000);
    var st = addBubble('me', ch, ts, 'emoji');
    pushPending(st);
    try {
      sendJSON({ t: 'emoji', body: ch, ts: ts });
      st.textContent = '';
      untrack(st);
    } catch (e) {
      st.textContent = '!';
      st.className = 'st bad';
      untrack(st);
    }
  }

  /* ================= 事件绑定 ================= */
  function buildEmojiPanel() {
    var frag = document.createDocumentFragment();
    EMOJIS.forEach(function (ch) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'emo';
      b.textContent = ch;
      b.addEventListener('click', function () { sendEmoji(ch); });
      frag.appendChild(b);
    });
    panelEl.appendChild(frag);
  }

  $('clear').addEventListener('click', function () {
    clearAll();
    refreshEmpty();
  });

  $('imgBtn').addEventListener('click', pickImage);
  $('fileInput').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) sendImageFile(f);
    e.target.value = '';
  });

  $('emojiBtn').addEventListener('click', function () {
    panelEl.classList.toggle('open');
    if (panelEl.classList.contains('open')) toBottom();
  });

  $('send').addEventListener('click', sendText);

  taEl.addEventListener('input', autosize);
  taEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendText();
    }
  });

  msgsEl.addEventListener('click', function () {
    panelEl.classList.remove('open');
  });

  $('go').addEventListener('click', submitToken);
  tokEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submitToken(); }
  });

  window.addEventListener('beforeunload', function () {
    if (ws) { try { ws.close(); } catch (e) {} }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !psk || authDead) return;
    if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
    if (retryTimer) return;
    connect();
  });

  /* ================= 启动 ================= */
  buildEmojiPanel();
  autosize();
  refreshEmpty();
  setStat('off', '已断开');

  (function boot() {
    var raw = urlToken();
    var bytes = raw ? parseToken(raw) : null;
    if (bytes) {
      psk = bytes;
      closeGate();
      connect();
    } else {
      openGate(raw ? '令牌格式不对，需要 32 字节的 Base64' : null);
    }
  })();
})();
</script>
</body>
</html>
