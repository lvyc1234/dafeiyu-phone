plugins { id 'com.android.application' }

android {
    namespace 'com.deepseek.dafeiyu.link'
    compileSdk 34

    defaultConfig {
        applicationId "com.deepseek.dafeiyu.link"
        minSdk 26
        targetSdk 34
        // 每次改动都要往上加，否则装不上（覆盖安装要求 versionCode 更大或同签名）
        versionCode 22
        versionName "2.0.2"
    }

    // 固定签名：仓库里带一个专用 keystore，保证每次 CI 出来的包能覆盖安装
    signingConfigs {
        fixed {
            storeFile file('../keystore/dafeiyu.jks')
            storePassword 'dafeiyu2026'
            keyAlias 'dafeiyu'
            keyPassword 'dafeiyu2026'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig = signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig = signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    // 内置 node 运行时（jniLibs），别让 AGP strip 掉
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += '**/libnode.so'
        }
    }
    androidResources {
        noCompress += ['so']
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation files('libs/core-3.5.3.jar')
}
