<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>大肥鱼</title>
<!--
  安卓 4.4（WebView = Chromium 30~33）兼容版：
  - 不用 CSS 变量 / grid / gap / inset / aspect-ratio / min() / env()
  - 不用 ES6：没有 let/const、箭头函数、模板字符串、Promise、async/await、padStart
  - 布局全部走 position:absolute + float + inline-block
  功能与 1.1.0 一致：轮询、发消息、图片上传、立绘、开机开关。
-->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0)}
html,body{height:100%;margin:0;padding:0}
body{
  background:#0b0e14;color:#e6edf3;
  font:15px/1.6 "Noto Sans SC","Microsoft YaHei",sans-serif;
  overflow:hidden;position:fixed;top:0;left:0;right:0;bottom:0;
}
button{font-family:inherit}

/* ---------- header ---------- */
#header{
  position:absolute;top:0;left:0;right:0;height:62px;
  background:#131c28;border-bottom:1px solid #273040;
}
#avatar{
  position:absolute;left:12px;top:9px;width:44px;height:44px;
  border-radius:22px;border:1px solid #2b3b50;background:#151d28;
  cursor:pointer;
}
#who{position:absolute;left:66px;top:10px;right:170px;height:44px;overflow:hidden}
#who h1{margin:0;font-size:17px;line-height:22px;font-weight:600;letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#who .sub{font-size:11px;color:#8b98a9;line-height:16px;white-space:nowrap;overflow:hidden}
#dot{display:inline-block;width:7px;height:7px;border-radius:4px;background:#d29922;
  margin-right:5px;vertical-align:middle}
#dot.on{background:#3fb950}
#dot.off{background:#f85149}
#gear,#galleryBtn{
  position:absolute;top:8px;width:40px;height:40px;padding:0;
  background:none;border:0;color:#8b98a9;font-size:20px;line-height:40px;text-align:center;
}
#gear{right:6px}
#galleryBtn{right:48px}
#bootBtn{
  position:absolute;right:92px;top:15px;height:32px;padding:0 8px;
  background:none;border:1px solid #2f7a4f;border-radius:10px;
  color:#7ee2a8;font-size:12px;font-weight:600;line-height:30px;
}

/* ---------- messages ---------- */
#messages{
  position:absolute;top:62px;left:0;right:0;bottom:64px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 10px 4px;
}
.row{width:100%;margin-bottom:9px;overflow:hidden}
.bubble{
  display:inline-block;max-width:84%;padding:9px 12px;border-radius:14px;
  font-size:14.5px;line-height:1.55;text-align:left;
  white-space:pre-wrap;word-break:break-all;
  border:1px solid #273040;background:#1a2432;
}
.row.me{text-align:right}
.row.me .bubble{background:#1d4f91;border-color:#2b5c8f}
.row.her{text-align:left}
.time{font-size:10px;color:#8b98a9;margin-top:4px;text-align:right}
.hint{color:#8b98a9;font-size:12px;text-align:center;padding:8px 0}

/* ---------- footer ---------- */
#footer{
  position:absolute;bottom:0;left:0;right:0;height:64px;
  background:#101820;border-top:1px solid #273040;
}
#attach{
  position:absolute;left:8px;bottom:10px;width:42px;height:42px;padding:0;
  border:1px solid #273040;border-radius:12px;background:#151d28;
  color:#e6edf3;font-size:18px;line-height:40px;text-align:center;
}
#attach:disabled{opacity:.45}
#fileInput{display:none}
#input{
  position:absolute;left:58px;right:74px;bottom:10px;height:42px;
  margin:0;padding:10px 12px;border:1px solid #273040;border-radius:12px;
  background:#151d28;color:#e6edf3;font-size:14.5px;line-height:20px;
  resize:none;outline:none;overflow:hidden;
}
#send{
  position:absolute;right:8px;bottom:10px;height:42px;min-width:58px;padding:0 12px;
  border:0;border-radius:12px;background:#4da3ff;color:#04101f;
  font-weight:700;font-size:14px;
}
#send:disabled{opacity:.45}

/* ---------- splash ---------- */
#splash{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:#0b0e14;
  text-align:center;
}
#splash img{
  width:78%;max-width:520px;margin-top:18%;border-radius:22px;
  box-shadow:0 20px 60px rgba(47,107,255,.32);
}
#splash.hidden{display:none}

/* ---------- gallery ---------- */
#galleryPanel{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:#080b10;
}
#galleryPanel.hidden{display:none}
.gallery-head{
  position:absolute;top:0;left:0;right:0;height:48px;
  border-bottom:1px solid #273040;color:#e6edf3;font-size:16px;font-weight:600;
}
.gallery-head span{position:absolute;left:16px;top:12px}
.gallery-head button{
  position:absolute;right:8px;top:4px;width:44px;height:40px;
  background:none;border:0;color:#8b98a9;font-size:26px;line-height:40px;
}
#galleryGrid{
  position:absolute;top:48px;left:0;right:0;bottom:44px;overflow-y:auto;
  -webkit-overflow-scrolling:touch;font-size:0;padding:6px;
}
#galleryGrid img{
  display:inline-block;width:33.33%;height:110px;padding:0;
  border:3px solid transparent;background:#151d28;
  vertical-align:top;
}
#galleryGrid img.active{border-color:#4da3ff}
.gallery-foot{
  position:absolute;left:0;right:0;bottom:0;height:44px;overflow:hidden;
  padding:4px 12px;color:#8b98a9;font-size:10px;line-height:18px;
  border-top:1px solid #273040;
}

/* ---------- settings ---------- */
#settingsPanel{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:#080b10;
  padding:18px;
}
#settingsPanel.hidden{display:none}
.settings-card{
  background:#101820;border:1px solid #273040;border-radius:16px;
  padding:16px;max-width:520px;margin:0 auto;
}
.settings-head{height:32px;margin-bottom:8px}
.settings-head strong{font-size:18px;float:left;line-height:32px}
.settings-head button{
  float:right;width:44px;height:32px;background:none;border:0;
  color:#8b98a9;font-size:24px;line-height:30px;
}
.settings-card label{display:block;color:#8b98a9;font-size:12px;margin:10px 0 6px}
.settings-card input{
  width:100%;height:44px;border:1px solid #273040;border-radius:10px;
  background:#151d28;color:#e6edf3;padding:0 12px;font-size:14px;outline:none;
}
.settings-actions{margin-top:10px}
.settings-actions button{
  width:100%;height:42px;border:0;border-radius:10px;background:#4da3ff;
  color:#04101f;font-weight:700;font-size:14px;
}
.settings-row{
  margin-top:16px;padding-top:14px;border-top:1px solid #273040;overflow:hidden;
}
.settings-row .left{float:left;width:66%}
.settings-row strong{font-size:15px}
.settings-row .hint2{font-size:11px;color:#8b98a9;margin-top:3px}
#bootToggle{
  float:right;width:96px;height:40px;border-radius:20px;border:1px solid #273040;
  background:#151d28;color:#e6edf3;font-weight:600;font-size:14px;
}
#bootToggle.on{background:#173d2a;border-color:#2f7a4f;color:#7ee2a8}
.settings-note{color:#8b98a9;font-size:11px;line-height:1.5;margin-top:10px}
</style>
</head>
<body>
<div id="splash"><img src="main-visual.png" alt="大肥鱼"></div>

<div id="header">
  <img id="avatar" src="avatar.jpg" alt="大肥鱼" title="点一下换一张">
  <div id="who">
    <h1>大肥鱼</h1>
    <div class="sub"><span id="dot" class="dot"></span><span id="status">连接中…</span></div>
  </div>
  <button id="bootBtn" title="开机自启">开机</button>
  <button id="galleryBtn" title="立绘">图</button>
  <button id="gear" title="设置">&#9881;</button>
</div>

<div id="galleryPanel" class="hidden">
  <div class="gallery-head"><span>大肥鱼的立绘 · 93</span><button id="galleryClose" title="关闭">×</button></div>
  <div id="galleryGrid"></div>
  <div class="gallery-foot">
    素材：AATINF/deepseek-whale-girl-assets（93 张分享版）<br>
    角色参考：TreapGoGo/deepseek-whale-girl（MIT License）
  </div>
</div>

<div id="settingsPanel" class="hidden">
  <div class="settings-card">
    <div class="settings-head"><strong>设置</strong><button id="settingsClose" title="关闭">×</button></div>
    <label for="settingsTopic">ntfy topic</label>
    <input id="settingsTopic" placeholder="dafeiyu-..." autocomplete="off">
    <div class="settings-actions"><button id="settingsSaveTopic">保存 topic</button></div>
    <div class="settings-row">
      <div class="left">
        <strong>开机自启</strong>
        <div class="hint2">下次重启生效</div>
      </div>
      <button id="bootToggle">开启</button>
    </div>
    <div id="bootState" class="settings-note">需要 AutoX 自启动权限；开启后重启手机，本鱼会自己回来。</div>
    <div class="settings-note">开关通过 ntfy 发给手机上的 agent。没有 topic 时先填 topic。</div>
  </div>
</div>

<main id="messages"></main>

<div id="footer">
  <button id="attach" title="上传图片">&#128206;</button>
  <input type="file" id="fileInput" accept="image/*">
  <textarea id="input" rows="1" placeholder="和她说点什么…"></textarea>
  <button id="send">发送</button>
</div>

<script src="gallery.js"></script>
<script>
(function () {
  "use strict";

  var DEFAULT_TOPIC = "";
  var topic = localStorage.getItem("dafeiyu_topic") || DEFAULT_TOPIC;
  var lastId = localStorage.getItem("dafeiyu_last_id") || "10m";
  var messages = [];
  try {
    messages = JSON.parse(localStorage.getItem("dafeiyu_msgs") || "[]");
  } catch (e) {
    messages = [];
  }
  if (!messages.length) {
    messages.push({
      role: "assistant",
      text: topic ? "本鱼在呢。今天想聊点啥？" :
        "先点右上角设置，把手机上 agent 的 ntfy topic 填进来。\ntopic 在 /sdcard/DeepSeekGirl/remote/topic.txt。",
      ts: nowSec()
    });
  }

  var main = byId("messages");
  var input = byId("input");
  var sendBtn = byId("send");
  var attach = byId("attach");
  var fileInput = byId("fileInput");
  var dot = byId("dot");
  var statusEl = byId("status");
  var avatarEl = byId("avatar");
  var galleryPanel = byId("galleryPanel");
  var galleryGrid = byId("galleryGrid");
  var galleryBtn = byId("galleryBtn");
  var galleryClose = byId("galleryClose");
  var settingsPanel = byId("settingsPanel");
  var settingsTopic = byId("settingsTopic");
  var settingsClose = byId("settingsClose");
  var settingsSaveTopic = byId("settingsSaveTopic");
  var bootToggle = byId("bootToggle");
  var bootState = byId("bootState");
  var bootBtn = byId("bootBtn");
  var GALLERY = window.DAFEIYU_GALLERY || ["C01.jpg"];
  var avatarIndex = parseInt(localStorage.getItem("dafeiyu_avatar") || "0", 10);
  if (isNaN(avatarIndex) || avatarIndex < 0 || avatarIndex >= GALLERY.length) avatarIndex = 0;
  var seq = 0;
  var callbacks = {};
  var polling = false;
  var pollTimer = null;
  var pollDelay = 15000;
  var bootStateValue = localStorage.getItem("dafeiyu_boot") || "unknown";

  function byId(id) {
    return document.getElementById(id);
  }

  function nowSec() {
    return Math.floor(new Date().getTime() / 1000);
  }

  function pad2(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function setStatus(text, cls) {
    statusEl.innerHTML = text;
    dot.className = "dot" + (cls ? " " + cls : "");
  }

  function setAdvanced(el, on) {
    if (!el) return;
    if (on) {
      if (el.className.indexOf("active") < 0) el.className = el.className + " active";
    } else {
      el.className = el.className.replace(/\s*active/g, "");
    }
  }

  function setAvatar(index) {
    if (!GALLERY.length) return;
    avatarIndex = (index % GALLERY.length + GALLERY.length) % GALLERY.length;
    avatarEl.src = GALLERY[avatarIndex];
    localStorage.setItem("dafeiyu_avatar", String(avatarIndex));
    var thumbs = galleryGrid.getElementsByTagName("img");
    for (var i = 0; i < thumbs.length; i++) {
      setAdvanced(thumbs[i], i === avatarIndex);
    }
  }

  function buildGallery() {
    var frag = document.createDocumentFragment();
    for (var i = 0; i < GALLERY.length; i++) {
      var im = document.createElement("img");
      im.src = GALLERY[i];
      im.alt = GALLERY[i];
      im.setAttribute("data-index", String(i));
      frag.appendChild(im);
    }
    galleryGrid.appendChild(frag);
  }

  function openGallery() {
    galleryPanel.className = "gallery-panel";
    galleryGrid.scrollTop = 0;
    setAvatar(avatarIndex);
  }

  function closeGallery() {
    galleryPanel.className = "gallery-panel hidden";
  }

  function setBootUi(state) {
    bootStateValue = state;
    localStorage.setItem("dafeiyu_boot", state);
    if (state === "on") {
      bootToggle.className = "on";
      bootToggle.innerHTML = "关闭";
      bootState.innerHTML = "已开启：下次重启，本鱼会自己回来。";
    } else if (state === "pending") {
      bootToggle.className = "";
      bootToggle.innerHTML = "发送中…";
      bootState.innerHTML = "正在发给手机上的 agent…";
    } else if (state === "off") {
      bootToggle.className = "";
      bootToggle.innerHTML = "开启";
      bootState.innerHTML = "已关闭：下次重启不会自动启动。";
    } else {
      bootToggle.className = "";
      bootToggle.innerHTML = "开启";
      bootState.innerHTML = "点右侧开启；需要 AutoX 自启动权限。";
    }
  }

  function openSettings() {
    settingsTopic.value = topic;
    setBootUi(bootStateValue);
    settingsPanel.className = "settings-panel";
  }

  function closeSettings() {
    settingsPanel.className = "settings-panel hidden";
  }

  /* ---------- native bridge（回调版，无 Promise） ---------- */
  window.__nativeResult = function (id, ok, status, body) {
    var cb = callbacks[id];
    if (!cb) return;
    delete callbacks[id];
    cb({ok: !!ok, status: status || 0, body: body || ""});
  };

  function nativeCall(method, args, cb) {
    if (!window.Android || typeof window.Android[method] !== "function") {
      cb({ok: false, status: 0, body: "native bridge not ready"});
      return;
    }
    var id = "cb" + (++seq);
    callbacks[id] = cb;
    var full = (args || []).slice(0);
    full.push(id);
    try {
      window.Android[method].apply(window.Android, full);
    } catch (e) {
      delete callbacks[id];
      cb({ok: false, status: 0, body: String(e)});
    }
  }

  function schedulePoll(ms) {
    if (pollTimer) clearTimeout(pollTimer);
    pollTimer = setTimeout(poll, ms);
  }

  function pageHidden() {
    if (typeof document.hidden === "boolean") return document.hidden;
    if (typeof document.webkitHidden === "boolean") return document.webkitHidden;
    return false;
  }

  function poll() {
    if (polling) return;
    if (!topic) {
      setStatus("先填 topic", "off");
      schedulePoll(15000);
      return;
    }
    if (pageHidden()) {
      schedulePoll(15000);
      return;
    }
    polling = true;
    nativeCall("poll", [topic, lastId], function (r) {
      polling = false;
      if (!r.ok) {
        if (r.status === 400) {
          lastId = "10m";
          localStorage.setItem("dafeiyu_last_id", lastId);
          pollDelay = 1000;
        } else if (r.status === 429) {
          pollDelay = 60000;
          setStatus("限流，60 秒后重试", "off");
        } else {
          pollDelay = 20000;
          setStatus("连接失败", "off");
        }
        schedulePoll(pollDelay);
        return;
      }
      var lines = String(r.body || "").split("\n");
      var changed = false;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].replace(/^\s+|\s+$/g, "");
        if (!line) continue;
        var msg;
        try {
          msg = JSON.parse(line);
        } catch (e) {
          continue;
        }
        if (msg.id) {
          lastId = msg.id;
          localStorage.setItem("dafeiyu_last_id", lastId);
        }
        if (msg.event !== "message") continue;
        var tags = msg.tags || [];
        var fromHer = msg.title === "Dafeiyu" || tags.indexOf("whale") !== -1;
        if (!fromHer) continue;
        var text = String(msg.message || "").replace(/^\s+|\s+$/g, "");
        if (!text) continue;
        add("assistant", text, msg.time);
        changed = true;
      }
      setStatus(changed ? "新消息" : "在线", "on");
      if (changed) {
        setTimeout(function () {
          setStatus("在线", "on");
        }, 2500);
      }
      pollDelay = 15000;
      schedulePoll(pollDelay);
    });
  }

  function sendBootCommand(cmd) {
    if (!topic) {
      setBootUi("unknown");
      add("assistant", "先保存 ntfy topic，再开启开机自启。", nowSec());
      return;
    }
    setBootUi("pending");
    nativeCall("publish", [topic, cmd], function (r) {
      if (!r.ok) {
        setBootUi("unknown");
        add("assistant", "开机自启命令发送失败：" + (r.body || r.status), nowSec());
      } else {
        add("assistant", cmd === "/boot on" ? "已发送开启请求，等她确认…" : "已发送关闭请求，等她确认…", nowSec());
      }
    });
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function fmtTime(ts) {
    try {
      var d = new Date((ts || nowSec()) * 1000);
      return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    } catch (e) {
      return "";
    }
  }

  function render() {
    var out = [];
    for (var i = 0; i < messages.length; i++) {
      var m = messages[i];
      out.push(
        '<div class="row ' + (m.role === "user" ? "me" : "her") + '">' +
        '<div class="bubble">' + esc(m.text) +
        '<div class="time">' + fmtTime(m.ts) + '</div></div></div>'
      );
    }
    main.innerHTML = out.join("");
    main.scrollTop = main.scrollHeight;
    try {
      localStorage.setItem("dafeiyu_msgs", JSON.stringify(messages.slice(-100)));
    } catch (e) {
    }
  }

  function add(role, text, ts) {
    var value = String(text);
    messages.push({role: role, text: value, ts: ts || nowSec()});
    if (messages.length > 100) messages = messages.slice(-100);
    if (role === "assistant" && value.indexOf("开机自启") !== -1) {
      if (value.indexOf("已开启") !== -1) setBootUi("on");
      else if (value.indexOf("已关闭") !== -1) setBootUi("off");
    }
    render();
  }

  function sendMessage() {
    var text = input.value.replace(/^\s+|\s+$/g, "");
    if (!text) return;
    if (!topic) {
      add("assistant", "先点右上角设置，把手机上 agent 的 ntfy topic 填进来。", nowSec());
      return;
    }
    input.value = "";
    input.style.height = "42px";
    add("user", text);
    sendBtn.disabled = true;
    nativeCall("publish", [topic, text], function (r) {
      sendBtn.disabled = false;
      if (!r.ok) add("assistant", "发送失败：" + (r.body || r.status), nowSec());
      schedulePoll(1500);
    });
  }

  function uploadPickedImage(file) {
    if (!file) return;
    if (!topic) {
      add("assistant", "先点右上角设置，把 topic 填进来，再上传图片。", nowSec());
      return;
    }
    if (file.type && !/^image\//.test(file.type)) {
      add("assistant", "这个不是图片文件。", nowSec());
      return;
    }
    if (file.size > 12 * 1024 * 1024) {
      add("assistant", "图片太大了，先压到 12MB 以内。", nowSec());
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      attach.disabled = true;
      nativeCall("uploadImage", [topic, String(reader.result), file.name || "upload.jpg"],
        function (r) {
          attach.disabled = false;
          fileInput.value = "";
          if (!r.ok) {
            add("assistant", "图片没传上去：" + (r.body || r.status), nowSec());
          } else {
            add("user", "[图] " + (file.name || "图片") + " 已上传");
            setStatus("图片已上传，等她看", "on");
            schedulePoll(800);
          }
        });
    };
    reader.onerror = function () {
      add("assistant", "图片读取失败。", nowSec());
    };
    reader.readAsDataURL(file);
  }

  /* ---------- bindings ---------- */
  avatarEl.addEventListener("click", function () {
    setAvatar(avatarIndex + 1);
  });
  galleryBtn.addEventListener("click", openGallery);
  galleryClose.addEventListener("click", closeGallery);
  galleryGrid.addEventListener("click", function (e) {
    var t = e.target || e.srcElement;
    if (!t || !t.getAttribute) return;
    var idx = t.getAttribute("data-index");
    if (idx !== null && idx !== undefined) {
      setAvatar(parseInt(idx, 10));
      closeGallery();
    }
  });

  bootBtn.addEventListener("click", openSettings);
  settingsClose.addEventListener("click", closeSettings);
  settingsPanel.addEventListener("click", function (e) {
    var t = e.target || e.srcElement;
    if (t === settingsPanel) closeSettings();
  });
  settingsSaveTopic.addEventListener("click", function () {
    var t = settingsTopic.value.replace(/^\s+|\s+$/g, "");
    if (!t) return;
    topic = t;
    localStorage.setItem("dafeiyu_topic", topic);
    lastId = "10m";
    localStorage.setItem("dafeiyu_last_id", lastId);
    messages = [{role: "assistant", text: "换好频道啦，本鱼在。", ts: nowSec()}];
    render();
    closeSettings();
    schedulePoll(200);
  });
  bootToggle.addEventListener("click", function () {
    var wantOn = bootStateValue !== "on";
    var script = wantOn ? "/sdcard/PhoneAgent/boot_on.js" : "/sdcard/PhoneAgent/boot_off.js";
    var ran = false;
    try {
      if (window.Android && window.Android.runScript) {
        window.Android.runScript(script);
        ran = true;
      }
    } catch (e) {
      ran = false;
    }
    if (ran) {
      setBootUi(wantOn ? "on" : "off");
      add("assistant", wantOn ?
        "已让手机打开开机自启：下次重启，本鱼会自己回来。" :
        "已让手机关闭开机自启：下次重启不会自动启动。", nowSec());
    } else {
      sendBootCommand(wantOn ? "/boot on" : "/boot off");
    }
  });

  attach.addEventListener("click", function () {
    fileInput.click();
  });
  fileInput.addEventListener("change", function () {
    if (fileInput.files && fileInput.files[0]) uploadPickedImage(fileInput.files[0]);
  });

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", function (e) {
    var key = e.key || "";
    if ((key === "Enter" || e.keyCode === 13) && !e.shiftKey) {
      if (e.preventDefault) e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener("input", function () {
    input.style.height = "42px";
    var h = input.scrollHeight;
    if (h > 110) h = 110;
    input.style.height = h + "px";
  });

  byId("gear").addEventListener("click", openSettings);

  document.addEventListener("visibilitychange", function () {
    if (!pageHidden()) {
      pollDelay = 15000;
      schedulePoll(200);
    }
  });

  setTimeout(function () {
    var splash = byId("splash");
    if (splash) splash.className = "hidden";
  }, 1400);

  buildGallery();
  setAvatar(avatarIndex);
  render();
  schedulePoll(500);
})();
</script>
</body>
</html>
